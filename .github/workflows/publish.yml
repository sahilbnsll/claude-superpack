name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@sahilbnsll'

      # Never publish a pack that fails its own benchmarks.
      - name: Verify before publishing
        run: node benchmarks/run.mjs

      # Accepts v5.0.0, 5.0.0, and the repo's older major-only superpack-v5 convention.
      # A major-only tag matches any version in that major; a full tag must match exactly.
      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#superpack-}"
          TAG="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          case "$PKG" in
            "$TAG"|"$TAG".*) echo "tag $GITHUB_REF_NAME matches package version $PKG" ;;
            *) echo "Release tag ($GITHUB_REF_NAME) does not match package.json version ($PKG)"; exit 1 ;;
          esac

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
